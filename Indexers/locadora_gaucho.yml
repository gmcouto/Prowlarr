---
id: locadora_gaucho
name: Locadora Gaucho (API)
description: "Locadora is a BRAZILIAN Private Torrent Tracker for MOVIES / TV / ANIME"
language: pt-BR
type: private
encoding: UTF-8
links:
  - https://locadora.cc/
legacylinks:
  - https://locadora.xyz/

caps:
  categorymappings:
    - {id: 1, cat: Movies, desc: "Filmes"}
    - {id: 2, cat: TV, desc: "Series"}
    - {id: 6, cat: TV/Anime, desc: "Animes"}
    - {id: 7, cat: Audio/Video, desc: "Shows"}

  modes:
    search: [q]
    tv-search: [q, season, ep, imdbid, tvdbid, tmdbid]
    movie-search: [q, imdbid, tmdbid]

settings:
  - name: apikey
    type: text
    label: APIKey
  - name: info_key
    type: info
    label: About your API key
    default: "Find or Generate a new API Token by accessing your <a href=\"https://locadora.cc/\" target=\"_blank\">Locadora</a> account <i>My Settings</i> page and clicking on the <b>API Key</b> tab."
  - name: freeleech
    type: checkbox
    label: Search freeleech only
    default: false
  - name: single_file_release_use_filename
    type: checkbox
    label: Use filename as title for single file releases
    default: false
  - name: sort
    type: select
    label: Sort requested from site
    default: created_at
    options:
      created_at: created
      seeders: seeders
      size: size
      name: title
  - name: type
    type: select
    label: Order requested from site
    default: desc
    options:
      desc: desc
      asc: asc
  - name: info_activity
    type: info
    label: Account Inactivity
    default: "Accounts that are inactive for 90 days are deactivated."

login:
  path: api/torrents
  method: get
  inputs: {} # TODO: remove in v10
  error:
    - selector: a[href*="/login"]
      message:
        text: "The API key was not accepted by {{ .Config.sitelink }}."
    - selector: :root:contains("Account is Banned")

search:
  paths:
    # https://hdinnovations.github.io/UNIT3D/torrent_api.html
    # https://github.com/HDInnovations/UNIT3D/blob/master/app/Http/Controllers/API/TorrentController.php#L657
    - path: api/torrents/filter
      response:
        type: json

  headers:
    Authorization: ["Bearer {{ .Config.apikey }}"]

  inputs:
  # if we have an id based search, add Season and Episode as query in name for UNIT3D < v6.  Else pass S/E Params for UNIT3D >= v6
    $raw: "{{ range .Categories }}&categories[]={{.}}{{end}}"
    name: "{{ .Keywords }}"
    seasonNumber: "{{ .Query.Season }}"
    episodeNumber: "{{ .Query.Ep }}"
    imdbId: "{{ .Query.IMDBIDShort }}"
    tmdbId: "{{ .Query.TMDBID }}"
    tvdbId: "{{ .Query.TVDBID }}"
    "free[]": "{{ if .Config.freeleech }}100{{ else }}{{ end }}"
    sortField: "{{ .Config.sort }}"
    sortDirection: "{{ .Config.type }}"
    perPage: 100

  keywordsfilters:
    - name: re_replace
      args: ["\\.", " "]

  rows:
    selector: data
    attribute: attributes

  fields:
    languages_media_info: # languages = "English (US), French (CA), Portuguese (Brazil)" -> "English, French, Portuguese (Brazil)"
      selector: media_info
      optional: true
      filters:
        - name: re_replace
          args: ['(?s)(.*)', '{{ if .Config.use_media_info }}$1{{ else }}{{ end }}']
        - name: re_replace
          args: ['(?s)^(?![\s\S]*Audio\s+(#\d+)?)[\s\S]*$', ''] # if media info does not contain audio information, give up
        - name: re_replace
          args: ['(?s)^(?![\s\S]*Language)[\s\S]*$', ''] # if media info does not contain language information, give up
        - name: re_replace
          args: ['\r', ''] # removes crappy \r char
        - name: re_replace
          args: ['(?s)(.*(?:Audio\s+(#\d+)?.*?(?:Language[^\n]+))).*', "$1\n"] # removes everything after the last audio language
        - name: re_replace
          args: ['(?s).*?(Audio\s+(#\d+)?.*?(?:Language[^\n]+))', "\n$1"] # removes everything before the first audio language
        - name: re_replace
          args: ['(?m)^(?!.*\bLanguage\b).*\n', ''] # removes every line that is not a Language line
        - name: re_replace
          args: ['(?s)^(?!.*Language\s*:).*|Language\s*:\s*', ''] # removes everything that is not the actual language
        - name: re_replace
          args: ['^\s+|\s+$', ''] # trim leading and trailing spaces
        - name: re_replace
          args: ['(?i)((:?Portuguese \(Brazil\)|Spanish \(Latino\)|Norwegian Bokmal|\w+)).*', '$1'] # Language Cleanup (only select languages are multiple words)
        - name: re_replace
          args: ['[\n]+', ', '] # creates a single line of languages separated by comma
        - name: re_replace
          args: ['\b([^,]+)(?:,\s*\1)+', '$1'] # removes duplicated languages
        - name: re_replace
          args: ['(?i)(Portugu.s|Brazilian)(?:[^,]+)?', "Portuguese (Brazil)"] # portuguese is Portuguese (Brazil) (for radarr and sonarr)
    subs: # languages = "English (US), French (CA), Portuguese (Brazil)" -> "English, French, Portuguese (Brazil)"
      selector: media_info
      optional: true
      filters:
        - name: re_replace
          args: ['(?s)(.*)', '{{ if .Config.use_media_info }}$1{{ else }}{{ end }}']
        - name: re_replace
          args: ['(?s)^(?![\s\S]*Text\s+(#\d+)?)[\s\S]*$', ''] # if media info does not contain Text information, give up
        - name: re_replace
          args: ['(?s)^(?![\s\S]*Language)[\s\S]*$', ''] # if media info does not contain language information, give up
        - name: re_replace
          args: ['\r', ''] # removes crappy \r char
        - name: re_replace
          args: ['(?s)(.*(?:Text\s+(#\d+)?.*?(?:Language[^\n]+))).*', "$1\n"] # removes everything after the last Text language
        - name: re_replace
          args: ['(?s).*?(Text\s+(#\d+)?.*?(?:Language[^\n]+))', "\n$1"] # removes everything before the first Text language
        - name: re_replace
          args: ['(?m)^(?!.*\bLanguage\b).*\n', ''] # removes every line that is not a Language line
        - name: re_replace
          args: ['(?s)^(?!.*Language\s*:).*|Language\s*:\s*', ''] # removes everything that is not the actual language
        - name: re_replace
          args: ['^\s+|\s+$', ''] # trim leading and trailing spaces
        - name: re_replace
          args: ['(?i)((:?Portuguese \(Brazil\)|Spanish \(Latino\)|Norwegian Bokmal|\w+)).*', '$1'] # Language Cleanup (only select languages are multiple words)
        - name: re_replace
          args: ['[\n]+', ', '] # creates a single line of languages separated by comma
        - name: re_replace
          args: ['\b([^,]+)(?:,\s*\1)+', '$1'] # removes duplicated languages
        - name: re_replace
          args: ['(?i)(Portugu.s|Brazilian)(?:[^,]+)?', "Portuguese (Brazil)"] # portuguese is Portuguese (Brazil) (for radarr and sonarr)
    category:
      selector: category_id
    title_optional:
      selector: name
    title_filename:
      selector: "files[0].name"
      optional: true
    files:
      selector: num_file
    orig_title:
      text: "{{ if and (.Config.single_file_release_use_filename) (eq .Result.files \"1\") (.Result.title_filename) }}{{ .Result.title_filename }}{{ else }}{{ .Result.title_optional }}{{ end }}"
    languages_title:
      text: '{{ .Result.orig_title }}'
      optional: true
      filters:
        - name: re_replace
          args: ['(?i)^.*?(?= \/ |$)', ''] # remove everything after the first " / " if it exists to capture built in languages
        - name: re_replace
          args: ['\s+', ', '] # replace multiple spaces with comma separator for built in languages
    languages:
      text: '{{ .Result.languages_title }}, {{ .Result.languages_media_info }}'
      optional: true
      filters:
        - name: re_replace
          args: ['\b([^,]+)(?:,\s*\1)+', '$1'] # removes duplicated languages
        - name: re_replace
          args: ['(?i)(Portugu.s|Brazilian)(?:[^,]+)?', "Portuguese (Brazil)"] # portuguese is Portuguese (Brazil) (for radarr and sonarr)
    title:
      text: "{{ .Result.orig_title }}"
      filters:
        - name: re_replace
          args: ['\s/\s.*', ''] # remove website built-in language suffixes from the title
    details:
      selector: details_link
    download:
      selector: download_link
    infohash:
      selector: info_hash
    poster:
      selector: meta.poster
      filters:
        - name: replace
          args: ["https://via.placeholder.com/90x135", ""]
    imdbid:
      selector: imdb_id
    tmdbid:
      selector: tmdb_id
    tvdbid:
      selector: tvdb_id
    genre:
      selector: meta.genres
      filters:
        - name: re_replace
          args: ["(?i)(Cinema TV)", "Cinema_TV"]
        - name: re_replace
          args: ["(?i)(Ficção científica)", "Ficção_científica"]
        - name: replace
          args: [" & ", "_&_"]
    _internal:
      selector: internal
      case:
        0: "{{ .False }}"
        1: "{{ .True }}"
    description:
      text: "{{ if .Result._internal }}Internal{{ else }}{{ end }}{{ if and .Result._internal .Result.genre }} | {{ else }}{{ end }}{{ .Result.genre }}"
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    grabs:
      selector: times_completed
    date:
      # "created_at": "2021-10-18T00:34:50.000000Z" is returned by Newtonsoft.Json.Linq as 18/10/2021 00:34:50
      selector: created_at
      filters:
        - name: append
          args: " +00:00" # GMT
        - name: dateparse
          args: "MM/dd/yyyy HH:mm:ss zzz"
    size:
      selector: size
    _featured:
      selector: featured
      case:
        False: "{{ .False }}"
        True: "{{ .True }}"
    downloadvolumefactor_freeleech:
      # api returns 0%, 25%, 50%, 75%, 100%
      selector: freeleech
      case:
        0%: 1 # not free
        25%: 0.75
        50%: 0.5
        75%: 0.25
        100%: 0 # freeleech
        "*": 0 # catch errors
    downloadvolumefactor:
      text: "{{ if .Result._featured }}0{{ else }}{{ .Result.downloadvolumefactor_freeleech }}{{ end }}"
    uploadvolumefactor_double_upload:
      # api returns False, True
      selector: double_upload
      case:
        False: 1 # normal
        True: 2 # double
    uploadvolumefactor:
      text: "{{ if .Result._featured }}2{{ else }}{{ .Result.uploadvolumefactor_double_upload }}{{ end }}"
# global MR is 0.4 but torrents must be seeded for 3 days regardless of ratio
#    minimumratio:
#      text: 0.4
    minimumseedtime:
      # 3 days (as seconds = 3 x 24 x 60 x 60)
      text: 259200
# json UNIT3D 8.2.0
