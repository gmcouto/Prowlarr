name: Sync upstream develop

on:
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Override upstream version (e.g. 2.3.6.5351). Leave empty to use latest stable release.'
        required: false
        type: string

concurrency:
  group: sync-upstream-develop
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  UPSTREAM_REPO: Prowlarr/Prowlarr
  INFRA_BRANCH: gmcouto/infra
  LANGSUBS_BRANCH: cardigann/langsubs
  MERGEHEADER_BRANCH: gmcouto/mergeheader
  DEVELOP_BRANCH: gmcouto-develop

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve upstream version
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.force_version }}" ]; then
            VERSION="${{ inputs.force_version }}"
            TAG="v${VERSION}"
            echo "Using forced version: ${VERSION}"
          else
            RELEASE=$(gh api "repos/${UPSTREAM_REPO}/releases/latest")
            PRERELEASE=$(echo "$RELEASE" | jq -r '.prerelease')
            if [ "$PRERELEASE" = "true" ]; then
              echo "Latest upstream release is a pre-release; aborting."
              exit 1
            fi
            TAG=$(echo "$RELEASE" | jq -r '.tag_name')
            VERSION="${TAG#v}"
            echo "Latest stable upstream release: ${VERSION} (${TAG})"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Fetch branches and upstream tag
        run: |
          git fetch origin "${INFRA_BRANCH}" "${LANGSUBS_BRANCH}" "${MERGEHEADER_BRANCH}"
          git fetch --force "https://github.com/${UPSTREAM_REPO}.git" "refs/tags/${{ steps.upstream.outputs.tag }}:refs/tags/${{ steps.upstream.outputs.tag }}"

      - name: Sync develop branch
        id: sync
        run: |
          set -e
          VERSION="${{ steps.upstream.outputs.version }}"
          TAG="${{ steps.upstream.outputs.tag }}"

          git checkout -B "${DEVELOP_BRANCH}" "${TAG}"

          if ! git merge --no-ff "origin/${INFRA_BRANCH}" -m "Apply gmcouto infra for develop ${VERSION}"; then
            echo "merge_failed=infra" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            git merge --abort || true
            exit 1
          fi

          COMMITS_TO_MERGE=$(git log --oneline "${TAG}..origin/${LANGSUBS_BRANCH}" | wc -l | tr -d ' ')
          echo "Commits to merge from ${LANGSUBS_BRANCH}: ${COMMITS_TO_MERGE}"
          if [ "${COMMITS_TO_MERGE}" -gt 2 ]; then
            echo "Warning: more than 2 commits would merge from ${LANGSUBS_BRANCH}"
          fi

          if ! git merge "origin/${LANGSUBS_BRANCH}" -m "Merge cardigann/langsubs for develop ${VERSION}"; then
            echo "merge_failed=langsubs" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            git merge --abort || true
            exit 1
          fi

          if ! git merge "origin/${MERGEHEADER_BRANCH}" -m "Merge gmcouto/mergeheader for develop ${VERSION}"; then
            echo "merge_failed=mergeheader" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            git merge --abort || true
            exit 1
          fi

          echo "merge_failed=" >> "$GITHUB_OUTPUT"

      - name: Open issue on merge failure
        if: failure() && steps.sync.outputs.merge_failed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          TAG="${{ steps.upstream.outputs.tag }}"
          FAILED="${{ steps.sync.outputs.merge_failed }}"
          BODY="Develop sync failed while merging \`${FAILED}\` for ${TAG}.

          Resolve conflicts on \`${DEVELOP_BRANCH}\`, then push the branch manually or re-run this workflow with \`force_version: ${VERSION}\`."

          if [ -f /tmp/conflicts.txt ] && [ -s /tmp/conflicts.txt ]; then
            CONFLICTS=$(cat /tmp/conflicts.txt)
            BODY="${BODY}

          Conflicted files:
          \`\`\`
          ${CONFLICTS}
          \`\`\`"
          fi

          gh issue create \
            --title "Develop sync failed for ${TAG}" \
            --label "develop-sync" \
            --body "$BODY" || \
          gh issue create \
            --title "Develop sync failed for ${TAG}" \
            --body "$BODY"

      - name: Push develop branch
        if: success()
        run: |
          git push origin "${DEVELOP_BRANCH}"
