name: gmcouto-release Alpine

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Prowlarr version (e.g. 2.3.6.5351)'
        required: true
        type: string

concurrency:
  group: gmcouto-release-alpine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  DOTNET_VERSION: '8.0.405'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Prowlarr ${VERSION}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Yarn
        run: corepack enable

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build frontend
        run: ./build.sh --frontend
        env:
          FORCE_COLOR: '0'
          PROWLARRVERSION: ${{ steps.version.outputs.version }}
          BUILD_SOURCEBRANCHNAME: gmcouto-release

      - name: Build musl backend (x64 + arm64)
        run: |
          common_args=(
            -restore src/Prowlarr.sln
            -p:SelfContained=True
            -p:Configuration=Release
            -p:Platform=Posix
            -p:NuGetAudit=false
            -t:PublishAllRids
          )
          dotnet msbuild "${common_args[@]}" -p:RuntimeIdentifiers=linux-musl-x64
          dotnet msbuild "${common_args[@]}" -p:RuntimeIdentifiers=linux-musl-arm64
        env:
          PROWLARRVERSION: ${{ steps.version.outputs.version }}
          BUILD_SOURCEBRANCHNAME: gmcouto-release

      - name: Package musl builds
        run: |
          ./build.sh --packages -f net8.0 -r linux-musl-x64
          ./build.sh --packages -f net8.0 -r linux-musl-arm64
          find _artifacts -name Prowlarr -exec chmod a+x {} \;
          find _artifacts -name Prowlarr.Update -exec chmod a+x {} \;
        env:
          PROWLARRVERSION: ${{ steps.version.outputs.version }}
          BUILD_SOURCEBRANCHNAME: gmcouto-release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/alpine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PROWLARR_VERSION=${{ steps.version.outputs.version }}
          provenance: false

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="Built from upstream Prowlarr ${VERSION} with cardigann/langsubs and gmcouto/mergeheader.

          Docker: \`ghcr.io/gmcouto/prowlarr:${VERSION}\`"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$VERSION" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$VERSION" --notes "$NOTES"
          fi
